name: Sky beta (GitHub Pages)
# Builds the Sky app from this fork and publishes it to GitHub Pages, so the MIDI importer
# changes can be tried in a browser before they go upstream.
on:
  push:
    branches:
      - midi-import-plus
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: 'npm'
      - run: npm ci
      - name: Build Sky
        run: npm run build:sky
        env:
          CI: false
          PUBLIC_IS_BETA: true
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/skyMusic
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
