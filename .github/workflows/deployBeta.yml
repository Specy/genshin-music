name: Beta Deploy
on:
  push:
    branches:
      - Dev
  workflow_dispatch:
    inputs:
      version:
        description: Void
        default: v0
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: 'npm'
      - name: Build
        run: npm install && npm run build:all
        env:
          CI: false
          PUBLIC_IS_BETA: true
      - name: Publish Genshin Music Nightly Beta
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy ./build/genshinMusic --project-name=beta-genshin-music-nightly
      - name: Publish Sky Music Nightly Beta
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy ./build/skyMusic --project-name=beta-sky-music-nightly
