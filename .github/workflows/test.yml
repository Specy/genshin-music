name: Test
on:
  push:
    branches:
      - main
      - 'migration/**'
  pull_request:
    branches:
      - main
      - 'migration/**'
jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Check (Genshin)
        run: npm run check
      - name: Check (Sky)
        run: npm run check:sky
      - name: Lint
        run: npm run lint
