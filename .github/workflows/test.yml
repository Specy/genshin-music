name: Test
on:
  push:
    branches:
      - main
      - 'migration/**'
  pull_request:
    branches:
      - main
      - 'migration/**'
jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Check (Genshin)
        run: npm run check
      - name: Check (Sky)
        run: npm run check:sky
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build:all
      - name: Build (no-root)
        run: npm run build:all-no-root
